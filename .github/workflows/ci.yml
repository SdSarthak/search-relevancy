name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install the spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Byte-compile every module
        run: python -m compileall -q src config tests scripts

      - name: Run the test suite
        run: pytest

  annoy-backend:
    # The optional ANNOY backend has to keep working where it does build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies including annoy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-annoy.txt

      - name: Run the test suite with annoy available
        run: pytest
