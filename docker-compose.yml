services:
  search-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: search-relevancy:latest
    container_name: search-relevancy-api
    ports:
      - "5000:5000"
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: 0
      INDEX_BACKEND: auto
      GUNICORN_WORKERS: 2
    # Uncomment once a .env file exists to load the rest of the settings:
    # env_file:
    #   - .env
    volumes:
      # Index, embeddings and metadata live outside the image.
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - search-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  search-network:
    driver: bridge
